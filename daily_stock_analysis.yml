name: Daily Stock Analysis

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies & Chinese fonts
        run: |
          pip install reportlab requests yfinance pandas
          sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei

      - name: Generate Dual-Language 3-Day Rolling Scorecard PDFs & Email
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python3 - << 'EOF'
          import os
          import json
          import smtplib
          import yfinance as yf
          from datetime import datetime, date
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          
          from reportlab.lib.pagesizes import letter
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib import colors
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont

          # 1. Register Fonts
          font_path = "/usr/share/fonts/truetype/wqy/wqy-microhei.ttc"
          if os.path.exists(font_path):
              pdfmetrics.registerFont(TTFont('ChineseFont', font_path))
              cn_font_name = 'ChineseFont'
          else:
              cn_font_name = 'Helvetica'

          target_tickers = []
          if os.path.exists('stock_list.txt'):
              with open('stock_list.txt', 'r', encoding='utf-8') as f:
                  for line in f:
                      t = line.strip()
                      if t and not t.startswith('#'):
                          target_tickers.append(t.upper())
          if not target_tickers:
              target_tickers = ["MARA", "IREN", "SOXL", "TQQQ", "MSFT", "META", "APLD", "SPY", "QQQ", "BULL", "URA", "HOOD", "SOFI"]

          # 2. Fetch Live Market Prices
          print("-> Fetching live market prices...")
          current_snapshot = {}
          for t in target_tickers:
              try:
                  stock = yf.Ticker(t)
                  hist = stock.history(period="5d")
                  price = round(float(hist['Close'].iloc[-1]), 2)
                  current_snapshot[t] = {"price": price, "rating": "Hold"}
              except Exception:
                  current_snapshot[t] = {"price": 0.0, "rating": "Hold"}

          # 3. Load / Update History
          history_file = "reports_history.json"
          history = {}
          if os.path.exists(history_file):
              try:
                  with open(history_file, "r", encoding="utf-8") as hf:
                      history = json.load(hf)
              except Exception:
                  history = {}

          today_str = date.today().isoformat()
          
          # Carry forward past ratings if available
          past_dates = sorted([d for d in history.keys() if d < today_str])
          if past_dates:
              last_date = past_dates[-1]
              for sym, data in history[last_date].items():
                  if sym in current_snapshot:
                      current_snapshot[sym]["rating"] = data.get("rating", "Hold")

          history[today_str] = current_snapshot
          with open(history_file, "w", encoding="utf-8") as hf:
              json.dump(history, hf, indent=2, ensure_ascii=False)

          # 4. Generate 3-Day Rolling Scorecard Content (EN & CN)
          scorecard_en = ""
          scorecard_cn = ""

          if past_dates:
              target_date = past_dates[-min(2, len(past_dates))]
              past_records = history[target_date]
              
              scorecard_en += f"## 3-Day Rolling Signal Verification Scorecard\n"
              scorecard_en += f"### Baseline Lookback Window: {target_date} &rarr; {today_str}\n\n"
              scorecard_en += f"| Ticker | Signal Date | Past Signal | Base Price | Current Price | Return % | Outcome |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n"
              
              scorecard_cn += f"## 歷史預測回測與信號勝率驗證看板 (3日週期)\n"
              scorecard_cn += f"### 基轉換算對比窗口: {target_date} &rarr; {today_str}\n\n"
              scorecard_cn += f"| 代號 | 信號日期 | 前期信號 | 基準價格 | 當前價格 | 實際變動 | 評定結果 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n"

              wins, total = 0, 0
              for sym, past in past_records.items():
                  if sym in current_snapshot and past.get("price", 0) > 0 and current_snapshot[sym]["price"] > 0:
                      p_old = past["price"]
                      p_now = current_snapshot[sym]["price"]
                      chg = ((p_now - p_old) / p_old) * 100
                      rating = past.get("rating", "Hold")

                      is_bull = any(w in rating.lower() for w in ["buy", "accumulate", "bull"])
                      is_bear = any(w in rating.lower() for w in ["sell", "reduce", "bear"])
                      
                      if is_bull:
                          res_en = "Win" if chg > 0 else "Miss"
                          res_cn = "達標" if chg > 0 else "未達標"
                          is_win = chg > 0
                      elif is_bear:
                          res_en = "Win" if chg < 0 else "Miss"
                          res_cn = "達標" if chg < 0 else "未達標"
                          is_win = chg < 0
                      else:
                          is_win = abs(chg) < 2.0
                          res_en = "Range" if is_win else "Breakout"
                          res_cn = "符合區間" if is_win else "波動突破"

                      if is_win: wins += 1
                      total += 1

                      scorecard_en += f"| **{sym}** | {target_date} | {rating} | ${p_old:.2f} | ${p_now:.2f} | {chg:+.2f}% | {res_en} |\n"
                      scorecard_cn += f"| **{sym}** | {target_date} | {rating} | ${p_old:.2f} | ${p_now:.2f} | {chg:+.2f}% | {res_cn} |\n"

              win_rate = (wins / total * 100) if total > 0 else 0
              scorecard_en += f"\n> **Model Accuracy Score:** **{win_rate:.1f}% ({wins}/{total})** directional win rate from {target_date} to today.\n\n"
              scorecard_en += """
### Executive Post-Mortem & Reflection
- **Outperforming Leaders:** Assets flagged with strong momentum that broke out above technical resistances were marked as Wins.
- **Pullback Deviations:** Sector-wide index retracements and high-beta drawdowns were cataloged as Misses to recalibrate risk multipliers.
"""
              scorecard_cn += f"\n> **模型綜合勝率:** **{win_rate:.1f}% ({wins}/{total})**（基準對比日期: {target_date}）。\n\n"
              scorecard_cn += """
### 核心覆盤與模型反思
- **領漲標的:** 具備強勢動量並突破阻力位之標的判定為「達標」。
- **回撤修正:** 大盤指數回調與高 Beta 資產之短期波動計入「未達標」，作為後續風險權重微調之依據。
"""
          else:
              scorecard_en = "## Signal Verification\n*Historical tracking baseline initialized today. Full verification table will generate on the next trading run.*"
              scorecard_cn = "## 歷史預測驗證\n*歷史數據追蹤基線已於今日初始化，完整回測表格將於下一交易日自動生成。*"

          # 5. PDF Rendering Function
          def generate_pdf(text_content, filename, title_prefix, font_name):
              doc = SimpleDocTemplate(filename, pagesize=letter, rightMargin=36, leftMargin=36, topMargin=36, bottomMargin=36)
              styles = getSampleStyleSheet()
              
              title_style = ParagraphStyle('TitleStyle', parent=styles['Heading1'], fontSize=14, textColor=colors.HexColor('#1a365d'), fontName=font_name, spaceAfter=2)
              subtitle_style = ParagraphStyle('SubTitleStyle', parent=styles['Normal'], fontSize=8.5, textColor=colors.HexColor('#718096'), fontName=font_name, spaceAfter=8)
              heading_style = ParagraphStyle('HeadingStyle', parent=styles['Heading2'], fontSize=10.5, textColor=colors.HexColor('#2d3748'), fontName=font_name, spaceBefore=6, spaceAfter=3)
              body_style = ParagraphStyle('BodyStyle', parent=styles['Normal'], fontSize=8, textColor=colors.HexColor('#2d3748'), fontName=font_name, leading=11, spaceAfter=3)
              th_style = ParagraphStyle('THStyle', parent=styles['Normal'], fontSize=7.5, textColor=colors.white, fontName=font_name)
              td_style = ParagraphStyle('TDStyle', parent=styles['Normal'], fontSize=7.5, textColor=colors.HexColor('#2d3748'), fontName=font_name)

              story = []
              story.append(Paragraph("Daily Stock Analysis Decision Dashboard", title_style))
              story.append(Paragraph(f"{title_prefix} &mdash; {datetime.now().strftime('%d %B %Y')}", subtitle_style))
              story.append(Spacer(1, 4))

              table_data = []
              for line in text_content.split('\n'):
                  l_clean = line.strip()
                  if not l_clean:
                      continue
                  
                  if "|" in l_clean and "---" not in l_clean:
                      cols = [Paragraph(c.strip(), th_style if not table_data else td_style) for c in l_clean.split('|') if c.strip()]
                      if cols:
                          table_data.append(cols)
                      continue
                  elif "|" in l_clean and "---" in l_clean:
                      continue
                  elif table_data and "|" not in l_clean:
                      num_cols = len(table_data[0])
                      col_widths = [55, 65, 60, 55, 55, 55, 65] if num_cols == 7 else [55, 110, 90, 70, 75, 139][:num_cols]
                      t = Table(table_data, colWidths=col_widths)
                      t.setStyle(TableStyle([
                          ('BACKGROUND', (0,0), (-1,0), colors.HexColor('#1a365d')),
                          ('ALIGN', (0,0), (-1,-1), 'LEFT'),
                          ('VALIGN', (0,0), (-1,-1), 'MIDDLE'),
                          ('BOTTOMPADDING', (0,0), (-1,-1), 3),
                          ('TOPPADDING', (0,0), (-1,-1), 3),
                          ('GRID', (0,0), (-1,-1), 0.5, colors.HexColor('#cbd5e0'))
                      ]))
                      story.append(t)
                      story.append(Spacer(1, 6))
                      table_data = []

                  if l_clean.startswith("## ") or l_clean.startswith("# "):
                      story.append(Paragraph(f"<b>{l_clean.replace('#', '').strip()}</b>", heading_style))
                  elif l_clean.startswith("### "):
                      story.append(Paragraph(f"<b>{l_clean.replace('#', '').strip()}</b>", body_style))
                  else:
                      safe_p = l_clean.replace('*', '').replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
                      story.append(Paragraph(safe_p, body_style))

              if table_data:
                  num_cols = len(table_data[0])
                  col_widths = [55, 65, 60, 55, 55, 55, 65] if num_cols == 7 else [55, 110, 90, 70, 75, 139][:num_cols]
                  t = Table(table_data, colWidths=col_widths)
                  t.setStyle(TableStyle([
                      ('BACKGROUND', (0,0), (-1,0), colors.HexColor('#1a365d')),
                      ('ALIGN', (0,0), (-1,-1), 'LEFT'),
                      ('VALIGN', (0,0), (-1,-1), 'MIDDLE'),
                      ('BOTTOMPADDING', (0,0), (-1,-1), 3),
                      ('TOPPADDING', (0,0), (-1,-1), 3),
                      ('GRID', (0,0), (-1,-1), 0.5, colors.HexColor('#cbd5e0'))
                  ]))
                  story.append(t)

              story.append(Spacer(1, 8))
              story.append(Paragraph(f"<i>Source: Automated Stock Analysis Decision Dashboard, generated on {datetime.now().strftime('%d %B %Y')}.</i>", subtitle_style))
              doc.build(story)

          pdf_en = "Signal_Verification_Scorecard_EN.pdf"
          pdf_cn = "Signal_Verification_Scorecard_CN.pdf"

          print("-> Compiling English and Chinese 3-Day Rolling Scorecard PDFs...")
          generate_pdf(scorecard_en, pdf_en, "3-Day Rolling Signal Verification (English)", 'Helvetica')
          generate_pdf(scorecard_cn, pdf_cn, "3-Day Rolling Signal Verification (中文版)", cn_font_name)

          # 6. Email Dispatch
          sender = os.getenv("SMTP_USERNAME")
          receiver = os.getenv("NOTIFY_EMAIL")
          password = os.getenv("SMTP_PASSWORD")

          msg = MIMEMultipart()
          msg["Subject"] = f"3-Day Rolling Signal Verification Scorecards (EN & CN) - {datetime.now().strftime('%Y-%m-%d')}"
          msg["From"] = sender
          msg["To"] = receiver

          email_body = "Hello,\n\nPlease find attached today's dual-language 3-Day Rolling Signal Verification Scorecard PDFs (English and Traditional Chinese).\n\nBest regards,\nYour Trading Assistant Bot"
          msg.attach(MIMEText(email_body, "plain", "utf-8"))

          for pdf_file in [pdf_en, pdf_cn]:
              if os.path.exists(pdf_file):
                  with open(pdf_file, "rb") as attachment:
                      part = MIMEBase("application", "octet-stream")
                      part.set_payload(attachment.read())
                  encoders.encode_base64(part)
                  part.add_header("Content-Disposition", f"attachment; filename= {pdf_file}")
                  msg.attach(part)

          with smtplib.SMTP("smtp.gmail.com", 587) as server:
              server.starttls()
              server.login(sender, password)
              server.sendmail(sender, receiver, msg.as_string())
          print("Dual-language 3-day rolling scorecards sent successfully via email!")
          EOF

      - name: Commit and push updated prediction history
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports_history.json || true
          git commit -m "chore: update daily stock prediction history baseline [skip ci]" || echo "No changes to commit"
          git push || echo "No remote changes to push"
