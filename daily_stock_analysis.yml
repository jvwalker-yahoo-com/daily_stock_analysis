name: Daily Stock Analysis

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies & Chinese fonts
        run: |
          pip install -r requirements.txt || true
          pip install reportlab requests yfinance pandas
          sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei

      - name: Run analysis dynamically in chunks from stock_list.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          ANPIRE_API_KEY: ${{ secrets.ANPIRE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          LITELLM_MODEL: "gemini-3.5-flash"
        run: |
          python3 -c "
          import os
          import time
          from src.core.pipeline import StockAnalysisPipeline
          from src.config import get_config
          
          config = get_config()
          stocks = []
          if os.path.exists('stock_list.txt'):
              with open('stock_list.txt', 'r', encoding='utf-8') as f:
                  for line in f:
                      ticker = line.strip()
                      if ticker and not ticker.startswith('#'):
                          stocks.append(ticker)
          
          print(f'Dynamically loaded stock list: {stocks}')
          
          chunk_size = 5
          stock_chunks = [stocks[i:i + chunk_size] for i in range(0, len(stocks), chunk_size)]
          pipeline = StockAnalysisPipeline(config=config)
          
          for idx, chunk in enumerate(stock_chunks):
              print(f'=== Processing Chunk {idx+1} of {len(stock_chunks)}: {chunk} ===')
              try:
                  pipeline.run(stock_list=chunk)
              except Exception as e:
                  print(f'Error processing chunk {chunk}: {e}')
              
              if idx < len(stock_chunks) - 1:
                  time.sleep(10)
          "

      - name: Generate Dual-Language (EN & CN) USD PDFs & Email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python3 - << 'EOF'
          import os
          import re
          import json
          import sqlite3
          import smtplib
          import yfinance as yf
          import requests as requests_lib
          from datetime import datetime, date
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          
          from reportlab.lib.pagesizes import letter
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib import colors
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont

          # 1. Register Fonts
          font_path = "/usr/share/fonts/truetype/wqy/wqy-microhei.ttc"
          if os.path.exists(font_path):
              pdfmetrics.registerFont(TTFont('ChineseFont', font_path))
              cn_font_name = 'ChineseFont'
          else:
              cn_font_name = 'Helvetica'

          target_tickers = []
          if os.path.exists('stock_list.txt'):
              with open('stock_list.txt', 'r', encoding='utf-8') as f:
                  for line in f:
                      t = line.strip()
                      if t and not t.startswith('#'):
                          target_tickers.append(t.upper())

          # 2. Extract DB & Report Dumps
          db_path = "data/stock_analysis.db"
          db_dump = ""
          if os.path.exists(db_path):
              try:
                  conn = sqlite3.connect(db_path)
                  cursor = conn.cursor()
                  cursor.execute("SELECT name FROM sqlite_master WHERE type='table';")
                  for table_name in cursor.fetchall():
                      t_name = table_name[0]
                      try:
                          cursor.execute(f"SELECT * FROM {t_name} ORDER BY rowid DESC LIMIT 120;")
                          for row in cursor.fetchall():
                              row_str = str(row)
                              if any(ticker in row_str.upper() for ticker in target_tickers):
                                  db_dump += row_str + "\n"
                      except Exception:
                          pass
                  conn.close()
              except Exception as e:
                  print(f"DB read note: {e}")

          import glob
          for f_path in glob.glob("output/**/*", recursive=True) + glob.glob("reports/**/*", recursive=True):
              try:
                  with open(f_path, "r", encoding="utf-8") as rf:
                      content = rf.read()
                      if any(ticker in content.upper() for ticker in target_tickers):
                          db_dump += f"\n--- {f_path} ---\n" + content
              except Exception:
                  pass

          if len(db_dump.strip()) < 50:
              db_dump = f"Active Watchlist: {', '.join(target_tickers)}. Analysis records compiled successfully."

          # 3. LLM API Call
          api_key = os.getenv("GEMINI_API_KEY")
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key={api_key}"
          headers = {"Content-Type": "application/json"}

          prompt_en = f"""
          You are a professional financial analyst. Review the provided records and produce a comprehensive executive summary report in USD currency covering ALL stocks from this watch list: {', '.join(target_tickers)}.
          
          Strict Rules:
          1. YOU MUST INCLUDE INDIVIDUAL BREAKDOWNS FOR EVERY SINGLE TICKER LISTED ({', '.join(target_tickers)}). Do not skip any ticker.
          2. All monetary values and price targets must be explicitly expressed in USD ($).
          3. Include a summary comparison table with columns: Ticker, Asset Name, Asset Class, Sentiment Score, Rating, and Core Signal.
          4. Provide individual asset breakdowns covering recent financial metrics, technical trend status, and risk advisory for EACH stock.

          Raw Portfolio Data:
          {db_dump[:24000]}
          """
          res_en = requests_lib.post(url, json={"contents": [{"parts": [{"text": prompt_en}]}], "generationConfig": {"temperature": 0.2, "maxOutputTokens": 6500}}, headers=headers, timeout=120)
          summary_en = res_en.json()["candidates"][0]["content"]["parts"][0]["text"] if res_en.status_code == 200 else "Analysis generated."

          prompt_cn = f"""
          You are a professional financial analyst. Review the provided records and produce a comprehensive executive summary report in Traditional Chinese, but leave all numerical values, financial metrics, share prices, target prices, market caps, and ticker symbols strictly in USD ($ format). Cover ALL stocks from this watch list: {', '.join(target_tickers)}.
          
          Strict Rules:
          1. YOU MUST INCLUDE INDIVIDUAL BREAKDOWNS FOR EVERY SINGLE TICKER LISTED ({', '.join(target_tickers)}). Do not skip any ticker.
          2. Translate all descriptive text into professional financial Chinese, but keep all monetary values in USD ($).
          3. Include a summary comparison table with columns: Ticker, Asset Name, Asset Class, Sentiment Score, Rating, and Core Signal (headers in Chinese).
          4. Provide individual asset breakdowns for EACH stock.

          Raw Portfolio Data:
          {db_dump[:24000]}
          """
          res_cn = requests_lib.post(url, json={"contents": [{"parts": [{"text": prompt_cn}]}], "generationConfig": {"temperature": 0.2, "maxOutputTokens": 6500}}, headers=headers, timeout=120)
          summary_cn = res_cn.json()["candidates"][0]["content"]["parts"][0]["text"] if res_cn.status_code == 200 else "Analysis generated."

          # 4. Extract Current Ratings & Accurate Live Prices
          history_file = "reports_history.json"
          history = {}
          if os.path.exists(history_file):
              try:
                  with open(history_file, "r", encoding="utf-8") as hf:
                      history = json.load(hf)
              except Exception:
                  history = {}

          today_str = date.today().isoformat()
          current_snapshot = {}

          for t in target_tickers:
              # 1. Fetch exact live closing/current price directly via yfinance
              try:
                  ticker_obj = yf.Ticker(t)
                  cur_p = round(float(ticker_obj.fast_info.last_price or ticker_obj.history(period="1d")['Close'].iloc[-1]), 2)
              except Exception:
                  # Fallback: parse specific section without greedy dotall
                  p_match = re.search(rf"(?:###|\b){t}\b[^\n]*\n(?:[^\n]*\n){{0,5}}.*?Price:[^\$\n]*\$([\d\.]+)", summary_en, re.IGNORECASE)
                  cur_p = float(p_match.group(1)) if p_match else 0.0

              # 2. Extract rating from summary table
              rating_match = re.search(rf"\*\*?{t}\*\*?\s*\|[^\n\|]*\|[^\n\|]*\|[^\n\|]*\|\s*([A-Za-z\s]+?)\s*\|", summary_en)
              if not rating_match:
                  rating_match = re.search(rf"\b{t}\b.*?\|\s*(Buy|Hold|Strong Buy|Tactical Buy|Accumulate|Sell)\b", summary_en, re.IGNORECASE)
              cur_rating = rating_match.group(1).strip() if rating_match else "Hold"

              current_snapshot[t] = {"price": cur_p, "rating": cur_rating}

          # Update history
          history[today_str] = current_snapshot
          with open(history_file, "w", encoding="utf-8") as hf:
              json.dump(history, hf, indent=2, ensure_ascii=False)

          # Calculate verification against historical date (lookback 2 sessions)
          past_dates = sorted([d for d in history.keys() if d < today_str])
          eval_table_en = ""
          eval_table_cn = ""
          
          if past_dates:
              target_date = past_dates[-min(2, len(past_dates))]
              past_records = history[target_date]
              
              eval_table_en = f"## 3-Day Rolling Signal Verification & Accuracy\n| Ticker | Signal Date | Past Signal | Base Price | Current Price | Return % | Outcome |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n"
              eval_table_cn = f"## 历史预测回测与信号胜率验证 (3日周期)\n| 代码 | 信号日期 | 前期信号 | 基准价格 | 当前价格 | 实际变动 | 评定结果 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n"
              
              wins, total = 0, 0
              for sym, past in past_records.items():
                  if sym in current_snapshot and past["price"] > 0 and current_snapshot[sym]["price"] > 0:
                      p_old = past["price"]
                      p_now = current_snapshot[sym]["price"]
                      chg = ((p_now - p_old) / p_old) * 100
                      rating = past.get("rating", "Hold")

                      is_bull = any(w in rating.lower() for w in ["buy", "accumulate", "bull"])
                      is_bear = any(w in rating.lower() for w in ["sell", "reduce", "bear"])
                      
                      if is_bull:
                          res_en = "Win" if chg > 0 else "Miss"
                          res_cn = "达标" if chg > 0 else "未达标"
                          is_win = chg > 0
                      elif is_bear:
                          res_en = "Win" if chg < 0 else "Miss"
                          res_cn = "达标" if chg < 0 else "未达标"
                          is_win = chg < 0
                      else:
                          is_win = abs(chg) < 2.0
                          res_en = "Range" if is_win else "Breakout"
                          res_cn = "符合区间" if is_win else "波动突破"

                      if is_win: wins += 1
                      total += 1

                      eval_table_en += f"| **{sym}** | {target_date} | {rating} | ${p_old:.2f} | ${p_now:.2f} | {chg:+.2f}% | {res_en} |\n"
                      eval_table_cn += f"| **{sym}** | {target_date} | {rating} | ${p_old:.2f} | ${p_now:.2f} | {chg:+.2f}% | {res_cn} |\n"

              win_rate = (wins / total * 100) if total > 0 else 0
              eval_table_en += f"\n> **Model Accuracy Score:** **{win_rate:.1f}% ({wins}/{total})** directional win rate from {target_date} to today.\n\n"
              eval_table_cn += f"\n> **模型综合胜率:** **{win_rate:.1f}% ({wins}/{total})**（基准对比日期: {target_date}）。\n\n"

          # 5. Build Final PDF Documents
          def generate_pdf(text_content, filename, title_prefix, font_name):
              doc = SimpleDocTemplate(filename, pagesize=letter, rightMargin=36, leftMargin=36, topMargin=36, bottomMargin=36)
              styles = getSampleStyleSheet()
              
              title_style = ParagraphStyle('TitleStyle', parent=styles['Heading1'], fontSize=14, textColor=colors.HexColor('#1a365d'), fontName=font_name, spaceAfter=2)
              subtitle_style = ParagraphStyle('SubTitleStyle', parent=styles['Normal'], fontSize=8.5, textColor=colors.HexColor('#718096'), fontName=font_name, spaceAfter=8)
              heading_style = ParagraphStyle('HeadingStyle', parent=styles['Heading2'], fontSize=10.5, textColor=colors.HexColor('#2d3748'), fontName=font_name, spaceBefore=6, spaceAfter=3)
              body_style = ParagraphStyle('BodyStyle', parent=styles['Normal'], fontSize=8, textColor=colors.HexColor('#2d3748'), fontName=font_name, leading=11, spaceAfter=3)
              th_style = ParagraphStyle('THStyle', parent=styles['Normal'], fontSize=7.5, textColor=colors.white, fontName=font_name)
              td_style = ParagraphStyle('TDStyle', parent=styles['Normal'], fontSize=7.5, textColor=colors.HexColor('#2d3748'), fontName=font_name)

              story = []
              story.append(Paragraph("Daily Stock Analysis Decision Dashboard", title_style))
              story.append(Paragraph(f"{title_prefix} &mdash; {datetime.now().strftime('%d %B %Y')}", subtitle_style))
              story.append(Spacer(1, 4))

              table_data = []
              for line in text_content.split('\n'):
                  l_clean = line.strip()
                  if not l_clean:
                      continue
                  
                  if "|" in l_clean and "---" not in l_clean:
                      cols = [Paragraph(c.strip(), th_style if not table_data else td_style) for c in l_clean.split('|') if c.strip()]
                      if cols:
                          table_data.append(cols)
                      continue
                  elif "|" in l_clean and "---" in l_clean:
                      continue
                  elif table_data and "|" not in l_clean:
                      num_cols = len(table_data[0])
                      col_widths = [55, 65, 60, 55, 55, 55, 65] if num_cols == 7 else [55, 110, 90, 70, 75, 139][:num_cols]
                      t = Table(table_data, colWidths=col_widths)
                      t.setStyle(TableStyle([
                          ('BACKGROUND', (0,0), (-1,0), colors.HexColor('#1a365d')),
                          ('ALIGN', (0,0), (-1,-1), 'LEFT'),
                          ('VALIGN', (0,0), (-1,-1), 'MIDDLE'),
                          ('BOTTOMPADDING', (0,0), (-1,-1), 3),
                          ('TOPPADDING', (0,0), (-1,-1), 3),
                          ('GRID', (0,0), (-1,-1), 0.5, colors.HexColor('#cbd5e0'))
                      ]))
                      story.append(t)
                      story.append(Spacer(1, 6))
                      table_data = []

                  if l_clean.startswith("## ") or l_clean.startswith("# "):
                      story.append(Paragraph(f"<b>{l_clean.replace('#', '').strip()}</b>", heading_style))
                  elif l_clean.startswith("### "):
                      story.append(Paragraph(f"<b>{l_clean.replace('#', '').strip()}</b>", body_style))
                  else:
                      safe_p = l_clean.replace('*', '').replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
                      story.append(Paragraph(safe_p, body_style))

              if table_data:
                  num_cols = len(table_data[0])
                  col_widths = [55, 65, 60, 55, 55, 55, 65] if num_cols == 7 else [55, 110, 90, 70, 75, 139][:num_cols]
                  t = Table(table_data, colWidths=col_widths)
                  t.setStyle(TableStyle([
                      ('BACKGROUND', (0,0), (-1,0), colors.HexColor('#1a365d')),
                      ('ALIGN', (0,0), (-1,-1), 'LEFT'),
                      ('VALIGN', (0,0), (-1,-1), 'MIDDLE'),
                      ('BOTTOMPADDING', (0,0), (-1,-1), 3),
                      ('TOPPADDING', (0,0), (-1,-1), 3),
                      ('GRID', (0,0), (-1,-1), 0.5, colors.HexColor('#cbd5e0'))
                  ]))
                  story.append(t)

              story.append(Spacer(1, 8))
              story.append(Paragraph(f"<i>Source: Automated Stock Analysis Decision Dashboard, generated on {datetime.now().strftime('%d %B %Y')}.</i>", subtitle_style))
              doc.build(story)

          pdf_en = "Active_Watchlist_Analysis_EN.pdf"
          pdf_cn = "Active_Watchlist_Analysis_CN.pdf"
          generate_pdf(eval_table_en + summary_en, pdf_en, "Active Watchlist Summary (English)", 'Helvetica')
          generate_pdf(eval_table_cn + summary_cn, pdf_cn, "Active Watchlist Summary (中文版)", cn_font_name)

          # 6. Email Dispatch
          sender = os.getenv("SMTP_USERNAME")
          receiver = os.getenv("NOTIFY_EMAIL")
          password = os.getenv("SMTP_PASSWORD")

          msg = MIMEMultipart()
          msg["Subject"] = f"Daily Stock Analysis & Verification Scorecard (EN & CN) - {datetime.now().strftime('%Y-%m-%d')}"
          msg["From"] = sender
          msg["To"] = receiver

          email_body = "Hello,\n\nPlease find attached your updated dual-language (English and Chinese) Daily Stock Analysis PDF Summaries, including the accurate rolling signal verification scorecard.\n\nBest regards,\nYour Trading Assistant Bot"
          msg.attach(MIMEText(email_body, "plain", "utf-8"))

          for pdf_file in [pdf_en, pdf_cn]:
              with open(pdf_file, "rb") as attachment:
                  part = MIMEBase("application", "octet-stream")
                  part.set_payload(attachment.read())
              encoders.encode_base64(part)
              part.add_header("Content-Disposition", f"attachment; filename= {pdf_file}")
              msg.attach(part)

          with smtplib.SMTP("smtp.gmail.com", 587) as server:
              server.starttls()
              server.login(sender, password)
              server.sendmail(sender, receiver, msg.as_string())
          print("Dual-language email with verification scorecard sent successfully!")
          EOF

      - name: Commit and push updated prediction history
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports_history.json || true
          git commit -m "chore: update daily stock prediction history baseline [skip ci]" || echo "No changes to commit"
          git push || echo "No remote changes to push"
