name: Daily Stock Analysis

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          ANPIRE_API_KEY: ${{ secrets.ANPIRE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          LITELLM_MODEL: "gemini-3.5-flash"
        run: python main.py

      - name: Send Formatted Email via Python
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import urllib.parse
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          raw_content = ""
          for path_pattern in ["output/*.md", "reports/*.md", "output/*.txt", "reports/*.txt"]:
              files = glob.glob(path_pattern)
              if files:
                  with open(files[0], "r", encoding="utf-8") as f:
                      raw_content = f.read(4000)
                  break

          if not raw_content:
              raw_content = "Analysis completed, but no summary file found."

          decoded_content = urllib.parse.unquote(raw_content)

          english_addendum = "\n\n---\n### English Translation Summary / Notes\n- **Total Analyzed**: Stock Portfolio Framework\n- **Market Status**: US Market · Pre-market\n- **Action Window**: Waiting for intraday confirmation; chasing highs is strictly prohibited.\n- **Analysis Model**: Gemini-3.5-flash"

          full_body = decoded_content + english_addendum

          sender = os.getenv("SMTP_USERNAME")
          receiver = os.getenv("NOTIFY_EMAIL")
          password = os.getenv("SMTP_PASSWORD")

          msg = MIMEMultipart("alternative")
          msg["Subject"] = "Daily Stock Analysis Results (Decision Dashboard)"
          msg["From"] = sender
          msg["To"] = receiver

          part = MIMEText(full_body, "plain", "utf-8")
          msg.attach(part)

          try:
              with smtplib.SMTP("smtp.gmail.com", 587) as server:
                  server.starttls()
                  server.login(sender, password)
                  server.sendmail(sender, receiver, msg.as_string())
              print("Email sent successfully with clean formatting!")
          except Exception as e:
              print(f"Failed to send email: {e}")
              raise e
          EOF
          
