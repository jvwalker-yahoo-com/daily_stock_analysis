name: Daily Stock Analysis

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install reportlab requests yfinance

      - name: Run analysis dynamically from stock_list.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          ANPIRE_API_KEY: ${{ secrets.ANPIRE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          LITELLM_MODEL: "gemini-3.5-flash"
        run: |
          python3 -c "
          import os
          import time
          from src.core.pipeline import StockAnalysisPipeline
          from src.config import get_config
          
          config = get_config()
          
          stocks = []
          if os.path.exists('stock_list.txt'):
              with open('stock_list.txt', 'r', encoding='utf-8') as f:
                  for line in f:
                      ticker = line.strip()
                      if ticker and not ticker.startswith('#'):
                          stocks.append(ticker)
          
          print(f'Loaded stock list: {stocks}')
          
          pipeline = StockAnalysisPipeline(config=config)
          for stock in stocks:
              print(f'>>> Processing asset: {stock}')
              try:
                  pipeline.run(stock_list=[stock])
              except Exception as e:
                  print(f'Error processing {stock}: {e}')
              print('Waiting 15s pacing delay...')
              time.sleep(15)
          "

      - name: Generate Full Portfolio Database-Driven USD PDF & Email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python3 - << 'EOF'
          import os
          import sqlite3
          import smtplib
          import requests
          from datetime import datetime
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          
          from reportlab.lib.pagesizes import letter
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib import colors

          db_path = "data/stock_analysis.db"
          db_dump = ""
          
          if os.path.exists(db_path):
              try:
                  conn = sqlite3.connect(db_path)
                  cursor = conn.cursor()
                  cursor.execute("SELECT name FROM sqlite_master WHERE type='table';")
                  tables = cursor.fetchall()
                  for table_name in tables:
                      t_name = table_name[0]
                      try:
                          cursor.execute(f"SELECT * FROM {t_name} ORDER BY rowid DESC LIMIT 50;")
                          rows = cursor.fetchall()
                          db_dump += f"\n--- TABLE: {t_name} ---\n"
                          for row in rows:
                              db_dump += str(row) + "\n"
                      except Exception as e:
                          print(f"Error reading table {t_name}: {e}")
                  conn.close()
              except Exception as db_err:
                  print(f"Database connection error: {db_err}")

          # Fallback check on output/report directories
          import glob
          for f_path in glob.glob("output/**/*", recursive=True) + glob.glob("reports/**/*", recursive=True) + glob.glob("*.txt"):
              try:
                  with open(f_path, "r", encoding="utf-8") as rf:
                      content = rf.read()
                      if len(content.strip()) > 10 and "stock_list.txt" not in f_path:
                          db_dump += f"\n--- FILE: {f_path} ---\n" + content
              except Exception:
                  pass

          print(f"Extracted payload length for Gemini: {len(db_dump)}")

          api_key = os.getenv("GEMINI_API_KEY")
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key={api_key}"
          
          prompt = f"""
          You are a professional financial analyst. Review the following portfolio records for all active assets (MARA, IREN, SOXL, TQQQ, MSFT, META, APLD, SPY, QQQ, BULL, URA, HOOD, SOFI). Produce a comprehensive executive summary report in USD currency.

          Strict Rules:
          1. Cover all active assets found in the data payload.
          2. All monetary values and price targets must be explicitly expressed in USD ($).
          3. Include a summary comparison table with columns: Ticker, Asset Name, Asset Class, Sentiment Score, Rating, and Core Signal.
          4. Provide individual asset breakdowns covering recent financial metrics, technical trend status, and risk advisory.

          Raw Portfolio Data:
          {db_dump[:20000]}
          """

          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"temperature": 0.2, "maxOutputTokens": 4096}
          }
          
          headers = {"Content-Type": "application/json"}
          summary_text = "Error: Gemini API response failed or timed out."
          
          try:
              res = requests.post(url, json=payload, headers=headers, timeout=60)
              print(f"Gemini API Status Code: {res.status_code}")
              if res.status_code == 200:
                  data = res.json()
                  if "candidates" in data and data["candidates"]:
                      summary_text = data["candidates"][0]["content"]["parts"][0]["text"]
                  else:
                      print(f"Unexpected Gemini response structure: {data}")
              else:
                  print(f"Gemini API Error Response: {res.text}")
          except Exception as ai_err:
              print(f"AI generation exception: {ai_err}")

          pdf_filename = f"Full_Portfolio_Stock_Analysis_{datetime.now().strftime('%Y-%m-%d')}.pdf"
          doc = SimpleDocTemplate(pdf_filename, pagesize=letter, rightMargin=36, leftMargin=36, topMargin=36, bottomMargin=36)
          styles = getSampleStyleSheet()
          
          title_style = ParagraphStyle('TitleStyle', parent=styles['Heading1'], fontSize=15, textColor=colors.HexColor('#1a365d'), spaceAfter=2)
          subtitle_style = ParagraphStyle('SubTitleStyle', parent=styles['Normal'], fontSize=9, textColor=colors.HexColor('#718096'), spaceAfter=10)
          heading_style = ParagraphStyle('HeadingStyle', parent=styles['Heading2'], fontSize=11, textColor=colors.HexColor('#2d3748'), spaceBefore=8, spaceAfter=4)
          body_style = ParagraphStyle('BodyStyle', parent=styles['Normal'], fontSize=8.5, textColor=colors.HexColor('#2d3748'), leading=12, spaceAfter=4)
          th_style = ParagraphStyle('THStyle', parent=styles['Normal'], fontSize=8, textColor=colors.white, fontName="Helvetica-Bold")
          td_style = ParagraphStyle('TDStyle', parent=styles['Normal'], fontSize=8, textColor=colors.HexColor('#2d3748'))

          story = []
          story.append(Paragraph("Daily Stock Analysis Decision Dashboard", title_style))
          story.append(Paragraph(f"Full Portfolio Summary &mdash; {datetime.now().strftime('%d %B %Y')}", subtitle_style))
          story.append(Spacer(1, 4))

          table_data = []
          for line in summary_text.split('\n'):
              l_clean = line.strip()
              if not l_clean:
                  continue
              
              if "|" in l_clean and "---" not in l_clean:
                  cols = [Paragraph(c.strip(), th_style if not table_data else td_style) for c in l_clean.split('|') if c.strip()]
                  if cols:
                      table_data.append(cols)
                  continue
              elif "|" in l_clean and "---" in l_clean:
                  continue
              elif table_data and "|" not in l_clean:
                  t = Table(table_data, colWidths=[55, 110, 90, 70, 75, 139])
                  t.setStyle(TableStyle([
                      ('BACKGROUND', (0,0), (-1,0), colors.HexColor('#1a365d')),
                      ('ALIGN', (0,0), (-1,-1), 'LEFT'),
                      ('VALIGN', (0,0), (-1,-1), 'MIDDLE'),
                      ('BOTTOMPADDING', (0,0), (-1,-1), 4),
                      ('TOPPADDING', (0,0), (-1,-1), 4),
                      ('GRID', (0,0), (-1,-1), 0.5, colors.HexColor('#cbd5e0'))
                  ]))
                  story.append(t)
                  story.append(Spacer(1, 6))
                  table_data = []

              if l_clean.startswith("## ") or l_clean.startswith("# "):
                  story.append(Paragraph(f"<b>{l_clean.replace('#', '').strip()}</b>", heading_style))
              elif l_clean.startswith("### "):
                  story.append(Paragraph(f"<b>{l_clean.replace('#', '').strip()}</b>", body_style))
              else:
                  safe_p = l_clean.replace('*', '').replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
                  story.append(Paragraph(safe_p, body_style))

          if table_data:
              t = Table(table_data, colWidths=[55, 110, 90, 70, 75, 139])
              t.setStyle(TableStyle([
                  ('BACKGROUND', (0,0), (-1,0), colors.HexColor('#1a365d')),
                  ('ALIGN', (0,0), (-1,-1), 'LEFT'),
                  ('VALIGN', (0,0), (-1,-1), 'MIDDLE'),
                  ('BOTTOMPADDING', (0,0), (-1,-1), 4),
                  ('TOPPADDING', (0,0), (-1,-1), 4),
                  ('GRID', (0,0), (-1,-1), 0.5, colors.HexColor('#cbd5e0'))
              ]))
              story.append(t)

          story.append(Spacer(1, 8))
          story.append(Paragraph(f"<i>Source: Automated Stock Analysis Decision Dashboard (Full Portfolio), generated on {datetime.now().strftime('%d %B %Y')}.</i>", subtitle_style))

          doc.build(story)
          print("PDF built successfully.")

          sender = os.getenv("SMTP_USERNAME")
          receiver = os.getenv("NOTIFY_EMAIL")
          password = os.getenv("SMTP_PASSWORD")

          msg = MIMEMultipart()
          msg["Subject"] = f"Full Portfolio Stock Analysis Summary - {datetime.now().strftime('%Y-%m-%d')}"
          msg["From"] = sender
          msg["To"] = receiver

          email_body = "Hello,\n\nPlease find attached your comprehensive Daily Stock Analysis PDF Summary.\n\nBest regards,\nYour Trading Assistant Bot"
          msg.attach(MIMEText(email_body, "plain", "utf-8"))

          with open(pdf_filename, "rb") as attachment:
              part = MIMEBase("application", "octet-stream")
              part.set_payload(attachment.read())
          encoders.encode_base64(part)
          part.add_header("Content-Disposition", f"attachment; filename= {pdf_filename}")
          msg.attach(part)

          with smtplib.SMTP("smtp.gmail.com", 587) as server:
              server.starttls()
              server.login(sender, password)
              server.sendmail(sender, receiver, msg.as_string())
          print("Email sent successfully!")
          EOF
