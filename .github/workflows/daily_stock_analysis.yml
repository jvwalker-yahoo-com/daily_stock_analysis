name: Daily Stock Analysis

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install reportlab requests

      - name: Run analysis (Sequential mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          ANPIRE_API_KEY: ${{ secrets.ANPIRE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          LITELLM_MODEL: "gemini-3.5-flash"
        run: |
          python3 -c "
          import os
          import time
          from src.core.pipeline import StockAnalysisPipeline
          from src.config import get_config
          
          config = get_config()
          stocks = [s.strip() for s in os.getenv('STOCK_LIST', '').split(',') if s.strip()]
          print(f'Running sequential analysis for: {stocks}')
          
          pipeline = StockAnalysisPipeline(config=config)
          for stock in stocks:
              print(f'>>> Processing single stock: {stock}')
              try:
                  pipeline.run(stock_list=[stock])
              except Exception as e:
                  print(f'Error processing {stock}: {e}')
              print('Waiting 20s before next stock...')
              time.sleep(20)
          "

      - name: Summarize via Gemini & Generate Professional PDF
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import urllib.parse
          import smtplib
          import requests
          from datetime import datetime
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          
          from reportlab.lib.pagesizes import letter
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib import colors

          # 1. Read generated report file from workspace
          raw_content = ""
          for path_pattern in ["output/*.md", "reports/*.md", "output/*.txt", "reports/*.txt", "*.md", "*.txt", "output/**/*.md", "reports/**/*.md"]:
              files = glob.glob(path_pattern, recursive=True)
              if files:
                  latest_file = max(files, key=os.path.getmtime)
                  print(f"Found report file: {latest_file}")
                  with open(latest_file, "r", encoding="utf-8") as f:
                      raw_content = f.read(15000)
                  break

          if not raw_content:
              raw_content = "No report content found."

          decoded_content = urllib.parse.unquote(raw_content)

          # 2. Precision Prompt forcing Gemini to focus ONLY on stock metrics and financials
          api_key = os.getenv("GEMINI_API_KEY")
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key={api_key}"
          
          prompt = f"""
          You are a professional financial editor. Extract and summarize ONLY the actual stock analysis data from the text below. Ignore any general system instructions, tool logs, or platform manuals.
          
          Provide the output structured precisely like this:
          - Overall Market Summary (mention the analyzed tickers, ratings, and scores).
          - Individual Stock Breakdowns (Ticker name, signal, score, time horizon, key financial metrics like Revenue, Net Income, ROE, Gross Margin if available).
          - Important Caveats & Action Guidelines (e.g. waiting for intraday confirmation, avoiding chasing highs).
          - Bottom Line / Risk Analysis.

          Raw Stock Report Data:
          {decoded_content[:12000]}
          """

          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"temperature": 0.1, "maxOutputTokens": 4096}
          }
          
          headers = {"Content-Type": "application/json"}
          summary_text = "Stock analysis generated successfully, but summary parsing encountered an issue."
          
          try:
              res = requests.post(url, json=payload, headers=headers, timeout=60)
              if res.status_code == 200:
                  data = res.json()
                  summary_text = data["candidates"][0]["content"]["parts"][0]["text"]
          except Exception as ai_err:
              print(f"AI summarization warning: {ai_err}")

          # 3. Build Professional PDF
          pdf_filename = f"Daily_Stock_Analysis_Summary_{datetime.now().strftime('%Y-%m-%d')}.pdf"
          doc = SimpleDocTemplate(pdf_filename, pagesize=letter, rightMargin=36, leftMargin=36, topMargin=36, bottomMargin=36)
          styles = getSampleStyleSheet()
          
          title_style = ParagraphStyle('TitleStyle', parent=styles['Heading1'], fontSize=16, textColor=colors.HexColor('#1a365d'), spaceAfter=2)
          subtitle_style = ParagraphStyle('SubTitleStyle', parent=styles['Normal'], fontSize=10, textColor=colors.HexColor('#718096'), spaceAfter=12)
          body_style = ParagraphStyle('BodyStyle', parent=styles['Normal'], fontSize=9, textColor=colors.HexColor('#2d3748'), leading=14, spaceAfter=6)

          story = []
          story.append(Paragraph("Daily Stock Analysis Decision Dashboard", title_style))
          story.append(Paragraph(f"Summary {datetime.now().strftime('%d %B %Y')}", subtitle_style))
          story.append(Spacer(1, 6))

          for line in summary_text.split('\n'):
              if line.strip():
                  safe_line = line.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
                  story.append(Paragraph(safe_line, body_style))
                  story.append(Spacer(1, 3))

          doc.build(story)
          print("Precision stock summary PDF generated successfully.")

          # 4. Construct and Email with PDF Attachment
          sender = os.getenv("SMTP_USERNAME")
          receiver = os.getenv("NOTIFY_EMAIL")
          password = os.getenv("SMTP_PASSWORD")

          msg = MIMEMultipart()
          msg["Subject"] = f"Daily Stock Analysis Summary - {datetime.now().strftime('%Y-%m-%d')}"
          msg["From"] = sender
          msg["To"] = receiver

          email_body = "Hello,\n\nPlease find attached your precise Daily Stock Analysis PDF Summary.\n\nBest regards,\nYour Trading Assistant Bot"
          msg.attach(MIMEText(email_body, "plain", "utf-8"))

          with open(pdf_filename, "rb") as attachment:
              part = MIMEBase("application", "octet-stream")
              part.set_payload(attachment.read())
          encoders.encode_base64(part)
          part.add_header("Content-Disposition", f"attachment; filename= {pdf_filename}")
          msg.attach(part)

          try:
              with smtplib.SMTP("smtp.gmail.com", 587) as server:
                  server.starttls()
                  server.login(sender, password)
                  server.sendmail(sender, receiver, msg.as_string())
              print("Email with precise PDF summary sent successfully!")
          except Exception as mail_err:
              print(f"ERROR: Failed to send email: {mail_err}")
              raise mail_err
          EOF
