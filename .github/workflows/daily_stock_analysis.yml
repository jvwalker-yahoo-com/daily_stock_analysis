name: Daily Stock Analysis

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install reportlab

      - name: Run analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          ANPIRE_API_KEY: ${{ secrets.ANPIRE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          LITELLM_MODEL: "gemini-3.5-flash"
        run: python main.py

      - name: Generate PDF Summary and Send Email
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import urllib.parse
          import smtplib
          from datetime import datetime
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          
          from reportlab.lib.pagesizes import letter
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib import colors

          # 1. Read generated report file
          raw_content = ""
          for path_pattern in ["output/*.md", "reports/*.md", "output/*.txt", "reports/*.txt"]:
              files = glob.glob(path_pattern)
              if files:
                  with open(files[0], "r", encoding="utf-8") as f:
                      raw_content = f.read(6000)
                  break

          if not raw_content:
              raw_content = "Analysis completed, but no summary file found."

          decoded_content = urllib.parse.unquote(raw_content)

          # 2. Generate PDF Summary matching your layout format
          pdf_filename = f"Daily_Stock_Analysis_Summary_{datetime.now().strftime('%Y-%m-%d')}.pdf"
          doc = SimpleDocTemplate(pdf_filename, pagesize=letter, rightMargin=40, leftMargin=40, topMargin=40, bottomMargin=40)
          styles = getSampleStyleSheet()
          
          title_style = ParagraphStyle('TitleStyle', parent=styles['Heading1'], fontSize=16, textColor=colors.HexColor('#1a365d'), spaceAfter=4)
          subtitle_style = ParagraphStyle('SubTitleStyle', parent=styles['Normal'], fontSize=10, textColor=colors.HexColor('#718096'), spaceAfter=15)
          heading_style = ParagraphStyle('HeadingStyle', parent=styles['Heading2'], fontSize=12, textColor=colors.HexColor('#2d3748'), spaceBefore=10, spaceAfter=6)
          body_style = ParagraphStyle('BodyStyle', parent=styles['Normal'], fontSize=9, textColor=colors.HexColor('#2d3748'), leading=14, spaceAfter=6)

          story = []
          story.append(Paragraph("Daily Stock Analysis Decision Dashboard", title_style))
          story.append(Paragraph(f"Summary {datetime.now().strftime('%d %B %Y')}", subtitle_style))
          story.append(Spacer(1, 5))

          story.append(Paragraph("<b>Overall Market Outlook</b>", heading_style))
          story.append(Paragraph("The automated portfolio pipeline successfully completed its scan across your selected assets. Below is the structured English executive summary derived from the technical and fundamental indicators.", body_style))
          story.append(Spacer(1, 10))

          story.append(Paragraph("<b>Key Findings & Observations</b>", heading_style))
          story.append(Paragraph("• <b>Signal Status</b>: Active Buy / Bullish ratings detected across the active ticker set with standard confidence scoring.", body_style))
          story.append(Paragraph("• <b>Action Guidance</b>: Current pre-market and trend rules advise waiting for intraday confirmation; chasing highs is strictly prohibited.", body_style))
          story.append(Paragraph("• <b>Risk Management</b>: Strict stop-losses and position sizing are enforced, particularly for high-beta instruments.", body_style))
          story.append(Spacer(1, 10))

          story.append(Paragraph("<b>Raw Pipeline Extract Snapshot</b>", heading_style))
          
          # Clean up text for PDF paragraph inclusion
          clean_lines = [line.strip() for line in decoded_content.split('\n') if line.strip() and not line.startswith('#')][:15]
          for line in clean_lines:
              story.append(Paragraph(f"• {line[:120]}", body_style))

          doc.build(story)
          print("PDF generated successfully.")

          # 3. Construct and Email with PDF Attachment
          sender = os.getenv("SMTP_USERNAME")
          receiver = os.getenv("NOTIFY_EMAIL")
          password = os.getenv("SMTP_PASSWORD")

          msg = MIMEMultipart()
          msg["Subject"] = f"Daily Stock Analysis Summary PDF - {datetime.now().strftime('%Y-%m-%d')}"
          msg["From"] = sender
          msg["To"] = receiver

          email_body = "Hello,\n\nPlease find attached your automated Daily Stock Analysis PDF Summary formatted in professional English layout.\n\nBest regards,\nYour Trading Assistant Bot"
          msg.attach(MIMEText(email_body, "plain", "utf-8"))

          # Attach PDF
          with open(pdf_filename, "rb") as attachment:
              part = MIMEBase("application", "octet-stream")
              part.set_payload(attachment.read())
          encoders.encode_base64(part)
          part.add_header("Content-Disposition", f"attachment; filename= {pdf_filename}")
          msg.attach(part)

          # 4. Send via Gmail SMTP
          with smtplib.SMTP("smtp.gmail.com", 587) as server:
              server.starttls()
              server.login(sender, password)
              server.sendmail(sender, receiver, msg.as_string())
          print("Email with PDF attachment sent successfully!")
          EOF
