name: Daily Stock Analysis

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install reportlab requests

      - name: Run analysis (Sequential mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          ANPIRE_API_KEY: ${{ secrets.ANPIRE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          LITELLM_MODEL: "gemini-3.5-flash"
        run: |
          python3 -c "
          import os
          import time
          from src.core.pipeline import StockAnalysisPipeline
          from src.config import get_config
          
          config = get_config()
          stocks = [s.strip() for s in os.getenv('STOCK_LIST', '').split(',') if s.strip()]
          print(f'Running sequential analysis for: {stocks}')
          
          pipeline = StockAnalysisPipeline(config=config)
          for stock in stocks:
              print(f'>>> Processing single stock: {stock}')
              try:
                  pipeline.run(stock_list=[stock])
              except Exception as e:
                  print(f'Error processing {stock}: {e}')
              print('Waiting 20s before next stock...')
              time.sleep(20)
          "

      - name: Generate Robust USD Table PDF Summary & Email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python3 - << 'EOF'
          import os
          import sqlite3
          import smtplib
          import requests
          from datetime import datetime
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          
          from reportlab.lib.pagesizes import letter
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib import colors

          # 1. Read directly from the SQLite database where pipeline stores analysis results
          db_path = "data/stock_analysis.db"
          raw_data_dump = ""
          
          if os.path.exists(db_path):
              try:
                  conn = sqlite3.connect(db_path)
                  cursor = conn.cursor()
                  # Query tables that contain stock analysis reports or metrics
                  cursor.execute("SELECT name FROM sqlite_master WHERE type='table';")
                  tables = cursor.fetchall()
                  for table_name in tables:
                      t_name = table_name[0]
                      try:
                          cursor.execute(f"SELECT * FROM {t_name} ORDER BY rowid DESC LIMIT 10;")
                          rows = cursor.fetchall()
                          raw_data_dump += f"\n--- TABLE: {t_name} ---\n"
                          for row in rows:
                              raw_data_dump += str(row) + "\n"
                      except Exception:
                          pass
                  conn.close()
              except Exception as db_err:
                  print(f"Database read warning: {db_err}")

          # Fallback to output files if database dump is empty
          if len(raw_data_dump.strip()) < 50:
              import glob
              for f_path in glob.glob("output/**/*", recursive=True) + glob.glob("reports/**/*", recursive=True):
                  try:
                      with open(f_path, "r", encoding="utf-8") as rf:
                          raw_data_dump += f"\n--- FILE: {f_path} ---\n" + rf.read()
                  except Exception:
                      pass

          print(f"Extracted raw data payload length: {len(raw_data_dump)}")

          # 2. Send payload to Gemini with strict instructions to convert CNY to USD and structure cleanly
          api_key = os.getenv("GEMINI_API_KEY")
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key={api_key}"
          
          prompt = f"""
          You are a professional financial editor. Review the raw stock database data and report text below. Produce a clean executive summary report in English.
          
          CRITICAL REQUIREMENTS:
          1. Convert all financial metrics originally in CNY into USD (using an approximate conversion rate of 6.75 CNY = 1 USD) and display them strictly in USD format (e.g., "$24.43 billion" instead of "CNY 164.7 billion").
          2. Include an overall portfolio overview table with Tickers, Names, Sectors, Sentiment Scores, and Ratings.
          3. Provide detailed asset breakdowns with revenue, net income, ROE, and target prices in USD.
          4. Include risk management and action guidelines.

          Raw Data Payload:
          {raw_data_dump[:15000]}
          """

          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"temperature": 0.2, "maxOutputTokens": 4096}
          }
          
          headers = {"Content-Type": "application/json"}
          summary_text = "Portfolio analysis successfully completed. All metrics processed."
          
          try:
              res = requests.post(url, json=payload, headers=headers, timeout=60)
              if res.status_code == 200:
                  data = res.json()
                  summary_text = data["candidates"][0]["content"]["parts"][0]["text"]
          except Exception as ai_err:
              print(f"AI generation warning: {ai_err}")

          # 3. Build Professional PDF using ReportLab layout elements & tables
          pdf_filename = f"Daily_Stock_Analysis_Summary_{datetime.now().strftime('%Y-%m-%d')}.pdf"
          doc = SimpleDocTemplate(pdf_filename, pagesize=letter, rightMargin=36, leftMargin=36, topMargin=36, bottomMargin=36)
          styles = getSampleStyleSheet()
          
          title_style = ParagraphStyle('TitleStyle', parent=styles['Heading1'], fontSize=15, textColor=colors.HexColor('#1a365d'), spaceAfter=2)
          subtitle_style = ParagraphStyle('SubTitleStyle', parent=styles['Normal'], fontSize=9, textColor=colors.HexColor('#718096'), spaceAfter=10)
          heading_style = ParagraphStyle('HeadingStyle', parent=styles['Heading2'], fontSize=11, textColor=colors.HexColor('#2d3748'), spaceBefore=8, spaceAfter=4)
          body_style = ParagraphStyle('BodyStyle', parent=styles['Normal'], fontSize=8.5, textColor=colors.HexColor('#2d3748'), leading=12, spaceAfter=4)
          th_style = ParagraphStyle('THStyle', parent=styles['Normal'], fontSize=8, textColor=colors.white, fontName="Helvetica-Bold")
          td_style = ParagraphStyle('TDStyle', parent=styles['Normal'], fontSize=8, textColor=colors.HexColor('#2d3748'))

          story = []
          story.append(Paragraph("Daily Stock Analysis Decision Dashboard", title_style))
          story.append(Paragraph(f"Executive Summary &mdash; {datetime.now().strftime('%d %B %Y')}", subtitle_style))
          story.append(Spacer(1, 4))

          table_data = []
          for line in summary_text.split('\n'):
              l_clean = line.strip()
              if not l_clean:
                  continue
              
              # Parse markdown tables cleanly into ReportLab tables
              if "|" in l_clean and "---" not in l_clean:
                  cols = [Paragraph(c.strip(), th_style if not table_data else td_style) for c in l_clean.split('|') if c.strip()]
                  if cols:
                      table_data.append(cols)
                  continue
              elif "|" in l_clean and "---" in l_clean:
                  continue
              elif table_data and "|" not in l_clean:
                  t = Table(table_data, colWidths=[90, 90, 85, 75, 75, 125])
                  t.setStyle(TableStyle([
                      ('BACKGROUND', (0,0), (-1,0), colors.HexColor('#1a365d')),
                      ('ALIGN', (0,0), (-1,-1), 'LEFT'),
                      ('VALIGN', (0,0), (-1,-1), 'MIDDLE'),
                      ('BOTTOMPADDING', (0,0), (-1,-1), 4),
                      ('TOPPADDING', (0,0), (-1,-1), 4),
                      ('GRID', (0,0), (-1,-1), 0.5, colors.HexColor('#cbd5e0'))
                  ]))
                  story.append(t)
                  story.append(Spacer(1, 6))
                  table_data = []

              if l_clean.startswith("## ") or l_clean.startswith("# "):
                  story.append(Paragraph(f"<b>{l_clean.replace('#', '').strip()}</b>", heading_style))
              elif l_clean.startswith("### "):
                  story.append(Paragraph(f"<b>{l_clean.replace('#', '').strip()}</b>", body_style))
              else:
                  safe_p = l_clean.replace('*', '').replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
                  story.append(Paragraph(safe_p, body_style))

          if table_data:
              t = Table(table_data, colWidths=[90, 90, 85, 75, 75, 125])
              t.setStyle(TableStyle([
                  ('BACKGROUND', (0,0), (-1,0), colors.HexColor('#1a365d')),
                  ('ALIGN', (0,0), (-1,-1), 'LEFT'),
                  ('VALIGN', (0,0), (-1,-1), 'MIDDLE'),
                  ('BOTTOMPADDING', (0,0), (-1,-1), 4),
                  ('TOPPADDING', (0,0), (-1,-1), 4),
                  ('GRID', (0,0), (-1,-1), 0.5, colors.HexColor('#cbd5e0'))
              ]))
              story.append(t)

          story.append(Spacer(1, 8))
          story.append(Paragraph(f"<i>Source: Automated Stock Analysis Decision Dashboard, generated on {datetime.now().strftime('%d %B %Y')}. (All values converted to USD).</i>", subtitle_style))

          doc.build(story)
          print("Robust USD table PDF generated successfully.")

          # 4. Email with PDF Attachment
          sender = os.getenv("SMTP_USERNAME")
          receiver = os.getenv("NOTIFY_EMAIL")
          password = os.getenv("SMTP_PASSWORD")

          msg = MIMEMultipart()
          msg["Subject"] = f"Daily Stock Analysis Summary (USD Tables) - {datetime.now().strftime('%Y-%m-%d')}"
          msg["From"] = sender
          msg["To"] = receiver

          email_body = "Hello,\n\nPlease find attached your structured Daily Stock Analysis PDF Summary featuring formatted tables and values converted to USD.\n\nBest regards,\nYour Trading Assistant Bot"
          msg.attach(MIMEText(email_body, "plain", "utf-8"))

          with open(pdf_filename, "rb") as attachment:
              part = MIMEBase("application", "octet-stream")
              part.set_payload(attachment.read())
          encoders.encode_base64(part)
          part.add_header("Content-Disposition", f"attachment; filename= {pdf_filename}")
          msg.attach(part)

          try:
              with smtplib.SMTP("smtp.gmail.com", 587) as server:
                  server.starttls()
                  server.login(sender, password)
                  server.sendmail(sender, receiver, msg.as_string())
              print("Email with robust USD PDF summary sent successfully!")
          except Exception as mail_err:
              print(f"ERROR: Failed to send email: {mail_err}")
              raise mail_err
          EOF
