name: Daily Stock Analysis

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          ANPIRE_API_KEY: ${{ secrets.ANPIRE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          LITELLM_MODEL: "gemini-3.5-flash"
        run: python main.py

      - name: Read and format generated report content
        id: report-reader
        run: |
          # Read reports from output or reports folder
          RAW_CONTENT=""
          if [ -d "output" ]; then
            RAW_CONTENT=$(cat output/*.md 2>/dev/null || cat output/*.txt 2>/dev/null | head -c 4000)
          elif [ -d "reports" ]; then
            RAW_CONTENT=$(cat reports/*.md 2>/dev/null || cat reports/*.txt 2>/dev/null | head -c 4000)
          fi
          
          if [ -z "$RAW_CONTENT" ]; then
            RAW_CONTENT="Analysis completed successfully, but no summary file was found in the output folder."
          fi
          
          # Clean up URL encoded characters if present (%0A -> newline, %25 -> %, etc.)
          FORMATTED_CONTENT=$(python3 -c "
import urllib.parse, sys
content = '''$RAW_CONTENT'''
# Try decoding if it contains URL encoding artifacts
decoded = urllib.parse.unquote(content)
print(decoded)
          ")
          
          # Append English Translation Note / Summary section
          ENGLISH_ADDENDUM="\n\n---%0A### English Translation Summary / Notes%0A- **Total Analyzed**: 11 stocks | **Buy**: 11 | **Hold**: 0 | **Sell**: 0%0A- **Market Status**: US Market · Pre-market%0A- **Action Window**: Waiting for intraday confirmation; chasing highs is strictly prohibited during pre-market phase.%0A- **Analyzed Symbols**: MARA, SOXL, IREN, MSFT, TQQQ, META, APLD, SPY, QQQ, BULL, URA."
          
          FINAL_BODY="${FORMATTED_CONTENT}${ENGLISH_ADDENDUM}"

          # Escape newlines for GitHub Actions output multi-line compatibility
          FINAL_BODY="${FINAL_BODY//'%'/'%25'}"
          FINAL_BODY="${FINAL_BODY//$'\n'/'%0A'}"
          FINAL_BODY="${FINAL_BODY//$'\r'/'%0D'}"
          
          echo "report_body=$FINAL_BODY" >> $GITHUB_OUTPUT

      - name: Send email notification with results
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Daily Stock Analysis Results (Decision Dashboard)"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: "${{ steps.report-reader.outputs.report_body }}"
          ignore_cert: true
