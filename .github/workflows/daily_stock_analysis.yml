name: Daily Stock Analysis

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          ANPIRE_API_KEY: ${{ secrets.ANPIRE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          LITELLM_MODEL: "gemini-3.5-flash"
        run: python main.py

      - name: Read generated report content
        id: report-reader
        run: |
          # Finds recent markdown or text reports generated by the pipeline
          REPORT_CONTENT=""
          if [ -d "output" ]; then
            REPORT_CONTENT=$(cat output/*.md 2>/dev/null || cat output/*.txt 2>/dev/null | head -c 3500)
          elif [ -d "reports" ]; then
            REPORT_CONTENT=$(cat reports/*.md 2>/dev/null || cat reports/*.txt 2>/dev/null | head -c 3500)
          fi
          
          if [ -z "$REPORT_CONTENT" ]; then
            REPORT_CONTENT="Analysis completed successfully, but no summary file was found in the output folder."
          fi
          
          # Escape newlines for multi-line GitHub Actions output
          REPORT_CONTENT="${REPORT_CONTENT//'%'/'%25'}"
          REPORT_CONTENT="${REPORT_CONTENT//$'\n'/'%0A'}"
          REPORT_CONTENT="${REPORT_CONTENT//$'\r'/'%0D'}"
          echo "report_body=$REPORT_CONTENT" >> $GITHUB_OUTPUT

      - name: Send email notification with results
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Daily Stock Analysis Results"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: "${{ steps.report-reader.outputs.report_body }}"
          ignore_cert: true
