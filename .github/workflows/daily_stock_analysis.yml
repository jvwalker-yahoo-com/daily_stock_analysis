name: Daily Stock Analysis

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install reportlab requests

      - name: Run analysis (Sequential mode to protect API limits)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          ANPIRE_API_KEY: ${{ secrets.ANPIRE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          LITELLM_MODEL: "gemini-3.5-flash"
        run: |
          # Force pipeline concurrency to 1 to prevent simultaneous 429 rate limits
          python3 -c "
          import os
          from src.core.pipeline import StockAnalysisPipeline
          from src.config import get_config
          
          config = get_config()
          # Force single worker mode
          stocks = [s.strip() for s in os.getenv('STOCK_LIST', '').split(',') if s.strip()]
          print(f'Running sequential analysis for: {stocks}')
          
          pipeline = StockAnalysisPipeline(config=config)
          # Run analysis stock by stock with a strict 20s pause between each
          import time
          for stock in stocks:
              print(f'>>> Processing single stock: {stock}')
              try:
                  pipeline.run(stock_list=[stock])
              except Exception as e:
                  print(f'Error processing {stock}: {e}')
              print('Waiting 20s before next stock...')
              time.sleep(20)
          "

      - name: Summarize via Gemini & Generate Professional PDF
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import urllib.parse
          import smtplib
          import requests
          from datetime import datetime
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          
          from reportlab.lib.pagesizes import letter
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib import colors

          # 1. Read generated report file
          raw_content = ""
          for path_pattern in ["output/*.md", "reports/*.md", "output/*.txt", "reports/*.txt"]:
              files = glob.glob(path_pattern)
              if files:
                  with open(files[0], "r", encoding="utf-8") as f:
                      raw_content = f.read(12000)
                  break

          if not raw_content:
              raw_content = "No report content found."

          decoded_content = urllib.parse.unquote(raw_content)

          # 2. Use Gemini to translate and generate a professional English summary
          api_key = os.getenv("GEMINI_API_KEY")
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key={api_key}"
          
          prompt = f"""
          You are a professional financial analyst. Review the following complete stock analysis report written in Chinese, and produce a clean, structured, and professional English executive summary report (similar to an institutional research brief). Include overall market outlook, individual stock breakdowns with their ratings, scores, key financial figures (like revenue, net income, ROE if available), and clear risk management guidance.

          Chinese Report Content:
          {decoded_content[:8000]}
          """

          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"temperature": 0.3, "maxOutputTokens": 4096}
          }
          
          headers = {"Content-Type": "application/json"}
          res = requests.post(url, json=payload, headers=headers, timeout=60)
          
          summary_text = "Failed to generate AI summary."
          if res.status_code == 200:
              try:
                  data = res.json()
                  summary_text = data["candidates"][0]["content"]["parts"][0]["text"]
              except Exception as e:
                  summary_text = f"Error parsing Gemini response: {e}"
          else:
              summary_text = f"API Error: {res.status_code} - {res.text}"

          # 3. Build Professional PDF from Gemini's English Summary
          pdf_filename = f"Daily_Stock_Analysis_Summary_{datetime.now().strftime('%Y-%m-%d')}.pdf"
          doc = SimpleDocTemplate(pdf_filename, pagesize=letter, rightMargin=36, leftMargin=36, topMargin=36, bottomMargin=36)
          styles = getSampleStyleSheet()
          
          title_style = ParagraphStyle('TitleStyle', parent=styles['Heading1'], fontSize=16, textColor=colors.HexColor('#1a365d'), spaceAfter=2)
          subtitle_style = ParagraphStyle('SubTitleStyle', parent=styles['Normal'], fontSize=10, textColor=colors.HexColor('#718096'), spaceAfter=12)
          body_style = ParagraphStyle('BodyStyle', parent=styles['Normal'], fontSize=9, textColor=colors.HexColor('#2d3748'), leading=14, spaceAfter=6)

          story = []
          story.append(Paragraph("Daily Stock Analysis Decision Dashboard", title_style))
          story.append(Paragraph(f"English Executive Summary — {datetime.now().strftime('%d %B %Y')}", subtitle_style))
          story.append(Spacer(1, 6))

          for paragraph in summary_text.split('\n\n'):
              if paragraph.strip():
                  cleaned_p = paragraph.replace('*', '').replace('#', '')
                  story.append(Paragraph(cleaned_p, body_style))
                  story.append(Spacer(1, 4))

          doc.build(story)
          print("AI-summarized PDF generated successfully.")

          # 4. Construct and Email with PDF Attachment
          sender = os.getenv("SMTP_USERNAME")
          receiver = os.getenv("NOTIFY_EMAIL")
          password = os.getenv("SMTP_PASSWORD")

          msg = MIMEMultipart()
          msg["Subject"] = f"Daily Stock Analysis English Summary PDF - {datetime.now().strftime('%Y-%m-%d')}"
          msg["From"] = sender
          msg["To"] = receiver

          email_body = "Hello,\n\nPlease find attached your AI-synthesized English summary PDF of today's stock analysis report.\n\nBest regards,\nYour Trading Assistant Bot"
          msg.attach(MIMEText(email_body, "plain", "utf-8"))

          with open(pdf_filename, "rb") as attachment:
              part = MIMEBase("application", "octet-stream")
              part.set_payload(attachment.read())
          encoders.encode_base64(part)
          part.add_header("Content-Disposition", f"attachment; filename= {pdf_filename}")
          msg.attach(part)

          with smtplib.SMTP("smtp.gmail.com", 587) as server:
              server.starttls()
              server.login(sender, password)
              server.sendmail(sender, receiver, msg.as_string())
          print("Email with AI-summarized PDF attachment sent successfully!")
          EOF
